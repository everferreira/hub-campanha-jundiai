<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hub de Campanha — Erika Hilton Jundiaí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/widgets.css">
  <style>
    /* Critical inline CSS to prevent FOUC */
    body { background: #0b0f19; color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; }
    #login-screen, #app-screen { display: none; }
    #login-screen.active { display: flex; }
    #app-screen.active { display: block; }
    .skeleton { background: linear-gradient(90deg, #151c2c 25%, #1e293b 50%, #151c2c 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>

  <!-- ═══ TELA DE LOGIN ═══ -->
  <div id="login-screen" class="active">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-icon">🚩</div>
        <h1>ERIKA HILTON <span>2026</span></h1>
        <p>Painel de Coordenação — Jundiaí</p>
      </div>
      <div class="people-grid" id="people-grid"></div>
      <div id="senha-area" class="senha-area" style="display:none">
        <div class="senha-card">
          <div class="senha-label" id="senha-label">🔐 Senha</div>
          <input type="password" id="senha-input" class="senha-input" placeholder="Digite a senha" onkeydown="if(event.key==='Enter')verificarSenha()">
          <div id="senha-erro" class="senha-erro"></div>
          <div class="senha-actions">
            <button class="btn primary" onclick="verificarSenha()">Entrar</button>
            <button class="btn secondary" onclick="cancelarSenha()">Voltar</button>
          </div>
          <div class="senha-mudar"><a href="#" onclick="mostrarMudarSenha();return false;">🔑 Mudar minha senha</a></div>
        </div>
      </div>
      <div id="mudar-senha-area" class="senha-area" style="display:none">
        <div class="senha-card">
          <div class="senha-label">🔑 Mudar senha</div>
          <input type="password" id="senha-antiga" class="senha-input" placeholder="Senha atual">
          <input type="password" id="senha-nova" class="senha-input" placeholder="Nova senha">
          <input type="password" id="senha-confirmar" class="senha-input" placeholder="Confirmar nova senha">
          <div id="mudar-senha-erro" class="senha-erro"></div>
          <div class="senha-actions">
            <button class="btn success" onclick="salvarNovaSenha()">Salvar</button>
            <button class="btn secondary" onclick="cancelarMudarSenha()">Voltar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ APLICAÇÃO ═══ -->
  <div id="app-screen">
    <header id="top-header">
      <div class="header-left">
        <span class="header-brand">🚩 Hub Jundiaí</span>
        <span id="clima-badge" class="clima-badge" style="display:none"></span>
      </div>
      <div class="header-right">
        <span id="relogio-sp" class="relogio">🕐 --:--</span>
        <span id="user-greeting" class="user-greeting"></span>
        <button id="btn-foco" class="btn icon" onclick="toggleModoFoco()" title="Modo Foco">🎯</button>
        <button class="btn secondary small" onclick="logout()">Sair</button>
      </div>
    </header>

    <!-- Toque de Reunir -->
    <div id="toque-reunir" class="toque-banner" style="display:none"></div>

    <!-- Navegação principal -->
    <nav id="main-nav" class="top-nav"></nav>

    <!-- Conteúdo dinâmico -->
    <main id="dashboard-content" class="container">
      <div class="skeleton" style="height:200px;margin-bottom:16px;"></div>
      <div class="skeleton" style="height:100px;margin-bottom:16px;"></div>
      <div class="skeleton" style="height:300px;"></div>
    </main>

    <!-- Bottom nav mobile -->
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <!-- ═══ SCRIPTS (ordem importa!) ═══ -->
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/map.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/data.FALLBACK.js"></script>
</body>
</html>
